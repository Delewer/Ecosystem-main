[tool.black]
extend-exclude = '''
/(
    \.claude
  | myenv
  | staticfiles
  | media
  | migrations
)/
| estudy/(admin_old|forms_old)\.py
'''

[tool.isort]
profile = "black"
skip = [".claude", "myenv", "staticfiles", "media"]
extend_skip_glob = ["*/migrations/*", "*/admin_old.py", "*/forms_old.py"]
